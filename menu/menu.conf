# tmux-kit 的中文選單本體:前綴鍵連按兩次時執行(tmux-kit.conf 綁的)
# 用 ↑↓ 選或滑鼠點、Enter 執行、Esc 關掉
#   -M:選單是鍵盤叫出來的,tmux 預設不收滑鼠,加了才點得到
#   -O:滑鼠移出選單時不會關掉,點選單外面才關
# 選單會先把指令裡的 # 展開一次,所以要留到執行時才展開的寫成 ##;選單裡的選單再多一層,寫成 ####
# 名字先放進 @tmux-kit-name 這類暫存選項再拿出來,名字裡有 # 也不會被當成特殊寫法
# 搬格子用 @視窗代號.格子編號 指定這一格,不用 %格子代號:選分頁的畫面會把指令裡的 %1、%2 換成你選的項目
display-menu -O -M -T "#[align=centre] 選單(↑↓ 選或滑鼠點,Enter 執行,Esc 關掉) " -x C -y C \
  "左右分割:右邊開一格" "" { split-window -h -c "#{pane_current_path}" } \
  "上下分割:下面開一格" "" { split-window -v -c "#{pane_current_path}" } \
  "放大這格 / 還原" "" { resize-pane -Z } \
  "關掉這格" "" { confirm-before -y -p "關掉這格?(Enter 確定,Esc 取消)" kill-pane } \
  "" \
  "開新分頁" "" { new-window -c "#{pane_current_path}" } \
  "下一個分頁" "" { next-window } \
  "上一個分頁" "" { previous-window } \
  "列出所有分頁,切換過去" "" { choose-tree -Zw } \
  "幫這個分頁取名" "" { command-prompt -p "新的分頁名稱(現在是 ##W；直接按 Enter 不改):" { set -w @tmux-kit-name "%%" ; if -F "##{!=:##{@tmux-kit-name},}" { rename-window -- "##{@tmux-kit-name}" } ; set -wu @tmux-kit-name } } \
  "這個分頁往左移" "" { if -F "#{window_start_flag}" { display-message "已經是最左邊的分頁了" } { swap-window -d -t :-1 } } \
  "這個分頁往右移" "" { if -F "#{window_end_flag}" { display-message "已經是最右邊的分頁了" } { swap-window -d -t :+1 } } \
  "分頁重新編號(補上空號)" "" { move-window -r ; display-message "分頁已經重新編號成 1、2、3…" } \
  "用滑鼠排列格子(開視窗,Cmd+Ctrl+A)" "" { run-shell -b 'if [ -x ~/.tmux-kit/tmux-kit-board ]; then ~/.tmux-kit/tmux-kit-board --client "#{client_name}" >/dev/null 2>&1; else tmux display-message "沒有裝排列視窗:重新執行 tmux-kit 的安裝,選要裝排列視窗(需要 Command Line Tools)"; fi' } \
  "模塊化排列(搬動格子、取名)…" "" { display-menu -O -M -T "#[align=centre] 模塊化排列(↑↓ 選或滑鼠點,Enter 執行,Esc 關掉) " -x C -y C \
    "把這格搬到別的分頁(接著選要去哪個分頁)" "" { choose-tree -Zw { join-pane -h -s '#{window_id}.#{pane_index}' -t "%%" } } \
    "把別的格子搬進這個分頁(接著選要搬哪一格)" "" { choose-tree -Zw { join-pane -h -s "%%" -t '#{window_id}.#{pane_index}' } } \
    "把這格拆出去,變成新的分頁" "" { if -F "#{==:#{window_panes},1}" { display-message "這個分頁只有這一格,不用拆" } { break-pane ; if -F "####{@tmux-kit-pane-name}" { set -w pane-border-status top } } } \
    "" \
    "排成左右並排" "" { select-layout even-horizontal } \
    "排成上下堆疊" "" { select-layout even-vertical } \
    "左邊一大格,右邊幾小格" "" { select-layout main-vertical } \
    "排成方格" "" { select-layout tiled } \
    "" \
    "幫這格取名(名字顯示在這格上方)" "" { command-prompt -p "這格的名字(直接按 Enter 不改):" { set -p @tmux-kit-new "%%" ; if -F "####{!=:####{@tmux-kit-new},}" { set -pF @tmux-kit-pane-name "####{@tmux-kit-new}" ; set -w pane-border-status top } ; set -pu @tmux-kit-new } } \
    "拿掉這格的名字" "" { set -pu @tmux-kit-pane-name ; if -F "####{==:####{P:####{?@tmux-kit-pane-name,1,}},}" { set -wu pane-border-status } } \
  } \
  "" \
  "幫這個工作階段取名" "" { command-prompt -p "新的工作階段名稱(現在是 ##S；直接按 Enter 不改):" { set @tmux-kit-sname "%%" ; if -F "##{!=:##{@tmux-kit-sname},}" { rename-session -- "##{@tmux-kit-sname}" } ; set -u @tmux-kit-sname } } \
  "關掉整個工作階段" "" { confirm-before -y -p "關掉整個工作階段 ##S?裡面 ##{session_windows} 個分頁的程式全部會關掉(Enter 確定,Esc 取消)" kill-session } \
  "" \
  "開關滑鼠功能" "" { set -g mouse ; display-message "滑鼠:#{?mouse,開,關}" }
