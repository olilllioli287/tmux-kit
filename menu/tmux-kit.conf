# tmux-kit:tmux 的中文選單和格子取名
# 安裝在 ~/.tmux-kit/,由 ~/.tmux.conf 裡的 source-file -q ~/.tmux-kit/tmux-kit.conf 載入
# (放在 ~/.tmux.conf 的最後面,前綴鍵才會認對)

# ===== 前綴鍵連按兩次 → 中文選單 =====
# 前綴鍵是 Ctrl+A 就是 Ctrl+A 兩下;沒改過的 tmux 是 Ctrl+B 兩下
# 像 codenv 那樣把 prefix 設成 None、自己用 Ctrl+A 進前綴模式的設定,當成 Ctrl+A
# 選單本體在 menu.conf,改選單只要改那個檔
run-shell 'k=$(tmux show -gv prefix); [ "$k" = None ] && k=C-a; tmux bind-key "$k" source-file ~/.tmux-kit/menu.conf'

# ===== 格子取名 =====
# 選單「模塊化排列」裡可以幫格子取名,名字存在 @tmux-kit-pane-name,顯示在格子上方
# 沒取名的格子顯示編號
set -g pane-border-format "#{?pane_active,#[reverse],} #{?@tmux-kit-pane-name,#{@tmux-kit-pane-name},#{pane_index}} #[default]"
# 格子搬進、搬出、拆開後,分頁裡還有取了名字的格子就顯示名字列,沒有就收起來
# (用 [91] 這個編號掛上去,重新載入時會蓋掉自己,不會越掛越多,也不會動到別人掛的)
set-hook -g 'window-layout-changed[91]' 'if -F "#{P:#{?@tmux-kit-pane-name,1,}}" "set -w pane-border-status top" "set -wu pane-border-status"'

# ===== 中文提示 =====
# 關掉最後一個分頁或整個工作階段時,有別的工作階段就切過去,不會直接跳出 tmux
set -g detach-on-destroy off
# 前綴鍵 x 關掉這格、& 關掉整個分頁:按 Enter 就能確定(原本要打 y,中文輸入法開著打不出來)
bind x confirm-before -y -p "關掉這格?(Enter 確定,Esc 取消)" kill-pane
bind & confirm-before -y -p "關掉整個分頁 #W?(Enter 確定,Esc 取消)" kill-window
# 前綴鍵 , 幫分頁取名:中文提示,輸入框是空的,直接打新名字;什麼都沒打就按 Enter 或 Esc 都不改
bind , command-prompt -p "新的分頁名稱(現在是 #W；直接按 Enter 不改):" { set -w @tmux-kit-name "%%" ; if -F "#{!=:#{@tmux-kit-name},}" { rename-window -- "#{@tmux-kit-name}" } ; set -wu @tmux-kit-name }
